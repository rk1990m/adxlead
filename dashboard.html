<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adxlead — Growth Workspace</title>
  <meta name="description" content="Adxlead Growth OS workspace: technical SEO audits, instant indexing, striking-distance quick wins, rank tracking, Google Ads guardrails and white-label client reports.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/base.css?v=3.2">
  <link rel="stylesheet" href="/assets/app.css?v=3.2">
</head>
<body>
  <div class="app">
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <a href="/" class="brand" title="Adxlead home">
        <span class="brand-mark">Ax</span>
        <span class="brand-name">Adxlead</span>
      </a>

      <button class="btn btn-primary btn-block btn-lg" id="btn-new-audit" type="button">
        <span data-i18n="newAudit">New Audit</span>
      </button>

      <nav class="nav" id="nav-main"></nav>

      <div class="nav-sep"></div>
      <nav class="nav" id="nav-collections"></nav>

      <div class="sidebar-foot">
        <div class="upgrade-card">
          <h4>Go Pro</h4>
          <p>Connect Google Search Console, track 100 keywords daily and export white-label reports.</p>
          <a class="btn btn-primary btn-sm btn-block" href="/#pricing">See plans</a>
        </div>
      </div>
    </aside>

    <!-- ================= MAIN ================= -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Open menu">
          <svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <label class="input-group search" for="global-search">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" id="global-search" type="search" placeholder="Search tools…" autocomplete="off">
          <span class="kbd">Ctrl K</span>
        </label>

        <div class="topbar-right">
          <div style="position:relative">
            <button class="whats-new" id="btn-whats-new" type="button">
              <span class="lbl" data-i18n="whatsNew">What's New?</span>
              <svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
              <span class="pulse"></span>
            </button>
            <div class="popover hidden" id="pop-whats-new"></div>
          </div>

          <select class="lang-select" id="lang-select" aria-label="Language">
            <option value="en">🇺🇸 English</option>
            <option value="hi">🇮🇳 हिन्दी</option>
          </select>

          <button class="user-chip" type="button" title="Local workspace (sign-in coming in Phase 1)">
            <span class="avatar">G</span>
            <span class="user-meta"><b>Guest Workspace</b><small>Local mode</small></span>
            <svg class="ico ico-sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </header>

      <main class="content" id="view-root" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div class="toast-stack" id="toast-root" aria-live="polite"></div>

  <script src="/assets/app.js?v=3.2"></script>
</body>
</html>
